name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: macos-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check available runtimes
        run: |
          python --version
          /bin/bash --version
          node --version
          node -e 'if (Number(process.versions.node.split(".")[0]) < 18) process.exit(1)'
      - name: Validate skill metadata and references
        run: python scripts/validate.py
      - name: Check installer syntax
        run: /bin/bash -n scripts/install.sh
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
